<ibid-header #headerHost [class.papikapi-header--hidden]="wordless()">
  <span headerBrand class="papikapi-brand">
    <span class="papikapi-brand__mark"><papikapi-pictogram name="mascot" /></span>
    {{ i18n.translate('appName') }}
  </span>

  <ibid-button
    headerActions
    class="papikapi-profile"
    variant="outlined"
    [intensity]="2"
    [ariaLabel]="profileLabel()"
    (clicked)="toggleProfile()"
  >
    {{ onDiary() ? i18n.translate('profileToChild') : i18n.translate('toParents') }}
  </ibid-button>

  <ibid-button
    headerActions
    class="papikapi-language"
    variant="secondary"
    [intensity]="1"
    [ariaLabel]="i18n.translate('languageToggleLabel')"
    (clicked)="toggleLanguage()"
  >
    {{ languageCode() }}
  </ibid-button>
</ibid-header>

<main class="papikapi-page">
  <router-outlet></router-outlet>
</main>
